# Sveltia CMS 配置 · 清哥的小屋
# 文档：https://sveltiacms.app/en/docs/start
# 访问：https://blog.hhq688.com/admin/

backend:
  name: github
  repo: HHQ-666/qingge-blog
  branch: main
  # 本站已改为「写作口令 + GitHub Token」登录（见 /admin 入口页），
  # 不再依赖 Netlify OAuth 代理。若以后自建 sveltia-cms-auth，可再填：
  # base_url: https://your-auth-worker.example.com

# 本地若跑 proxy 可保持 true；线上静态托管会忽略
local_backend: true

# 媒体上传到 public/media/uploads，前台路径 /media/uploads/...
media_folder: public
public_folder: /

locale: zh_Hans

# 站点 URL（用于预览链接）
site_url: https://blog.hhq688.com
display_url: https://blog.hhq688.com
logo_url: /favicon/favicon-light-192.png

slug:
  encoding: unicode
  clean_accents: false
  sanitize_replacement: "-"

collections:
  - name: posts
    label: 全部文章
    label_singular: 文章
    description: 写入 src/content/posts，保存后提交到 GitHub，Vercel 自动构建上线。
    folder: src/content/posts
    create: true
    delete: true
    sortable_fields: &postsSortableFields
      fields:
        - published
        - title
        - description
      default:
        field: published
        direction: descending
    # 文件名：标题 slug + 时间戳，避免中文/重复冲突
    slug: "{{slug}}-{{year}}{{month}}{{day}}{{hour}}{{minute}}"
    extension: md
    format: frontmatter
    # 预览路径（与 Astro 路由一致：去掉扩展名）
    preview_path: "posts/{{dirname}}/{{filename}}"
    fields: &postsFields
      - name: title
        label: 标题
        widget: string
        required: true

      - name: published
        label: 发布日期
        widget: datetime
        date_format: YYYY-MM-DD
        time_format: false
        format: YYYY-MM-DD
        required: true

      - name: description
        label: 简介
        widget: text
        required: false
        hint: 列表卡片与 SEO 摘要

      - name: image
        label: 封面图
        widget: image
        required: false
        choose_url: true
        media_folder: public/media/uploads/covers
        public_folder: /media/uploads/covers
        hint: 点击「Browse」可从 media/uploads/covers 已有的 14 张分类封面中选择，也可以拖拽/上传新图片；留空则无封面

      - name: category
        label: 分类
        widget: string
        required: false
        hint: 现有分类：Vue / CSS / JavaScript / 前端 / 面试；请手动输入分类名称，支持任意新分类

      - name: tags
        label: 标签
        widget: list
        required: false
        hint: 常用标签：vue / javascript / 前端 / css / html 等；请手动输入标签并按回车添加
        field:
          name: tag
          label: 标签
          widget: string

      - name: draft
        label: 草稿
        widget: boolean
        default: false
        hint: 勾选后前台不展示（Astro draft）

      - name: lang
        label: 语言
        widget: select
        default: zh_CN
        options:
          - { label: 简体中文, value: zh_CN }
          - { label: English, value: en }
          - { label: 日本語, value: ja }
        required: false

      - name: body
        label: 正文
        widget: markdown
        required: true
        hint: 支持 Markdown；代码块、列表等

  - divider: true
    name: posts-by-category-divider

  - name: posts_vue
    label: Vue
    label_singular: 文章
    description: 按分类快速查看「Vue」相关文章（仅浏览/编辑，新增文章请使用「全部文章」）。
    icon: filter_alt
    folder: src/content/posts
    filter: { field: category, value: "Vue" }
    create: false
    delete: false
    sortable_fields: *postsSortableFields
    extension: md
    format: frontmatter
    preview_path: "posts/{{dirname}}/{{filename}}"
    fields: *postsFields

  - name: posts_css
    label: CSS
    label_singular: 文章
    description: 按分类快速查看「CSS」相关文章（仅浏览/编辑，新增文章请使用「全部文章」）。
    icon: filter_alt
    folder: src/content/posts
    filter: { field: category, value: "CSS" }
    create: false
    delete: false
    sortable_fields: *postsSortableFields
    extension: md
    format: frontmatter
    preview_path: "posts/{{dirname}}/{{filename}}"
    fields: *postsFields

  - name: posts_javascript
    label: JavaScript
    label_singular: 文章
    description: 按分类快速查看「JavaScript」相关文章（仅浏览/编辑，新增文章请使用「全部文章」）。
    icon: filter_alt
    folder: src/content/posts
    filter: { field: category, value: "JavaScript" }
    create: false
    delete: false
    sortable_fields: *postsSortableFields
    extension: md
    format: frontmatter
    preview_path: "posts/{{dirname}}/{{filename}}"
    fields: *postsFields

  - name: posts_frontend
    label: 前端
    label_singular: 文章
    description: 按分类快速查看「前端」相关文章（仅浏览/编辑，新增文章请使用「全部文章」）。
    icon: filter_alt
    folder: src/content/posts
    filter: { field: category, value: "前端" }
    create: false
    delete: false
    sortable_fields: *postsSortableFields
    extension: md
    format: frontmatter
    preview_path: "posts/{{dirname}}/{{filename}}"
    fields: *postsFields

  - name: posts_interview
    label: 面试
    label_singular: 文章
    description: 按分类快速查看「面试」相关文章（仅浏览/编辑，新增文章请使用「全部文章」）。
    icon: filter_alt
    folder: src/content/posts
    filter: { field: category, value: "面试" }
    create: false
    delete: false
    sortable_fields: *postsSortableFields
    extension: md
    format: frontmatter
    preview_path: "posts/{{dirname}}/{{filename}}"
    fields: *postsFields

<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="utf-8" />

			html,
			body {
				margin: 0;

					-apple-system,
					"Segoe UI",
					Roboto,
					"PingFang SC",
					"Noto Sans SC",
					sans-serif;
			}
			.admin-boot {
				max-width: 28rem;
				margin: 12vh auto;
				padding: 1.5rem;

			.admin-boot h1 {
